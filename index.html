/* ---------- Uniforms compartidos ---------- */
const U = {
  uTime: { value: 0 },
  uPR: { value: PR },
  uSpeed: { value: 0.016 },
  uDim: { value: 1 }

const omega = (r) => U.uSpeed.value * (0.55 + 0.9 / (1.0 + r * 0.16));

const diskVert = /* glsl */`
  uniform float uTime, uPR, uSpeed, uSize, uDim, uMax;
  attribute vec3 aParams;
  attribute vec3 aColor;
  attribute float aSize;
  attribute float aSeed;
  varying vec3 vColor;
  varying float vAlpha;
  varying float vRot;
  void main(){
    float r = aParams.x;
    float a = aParams.y + uTime * uSpeed * (0.55 + 0.9 / (1.0 + r * 0.16));
    vec3 p = vec3(cos(a) * r, aParams.z, sin(a) * r);
    vec4 mv = modelViewMatrix * vec4(p, 1.0);
    gl_Position = projectionMatrix * mv;
    float s = aSize * uSize * uPR / max(-mv.z, 0.1);
    float alpha = smoothstep(1.5, 6.0, -mv.z);
    if (s < 1.6) { alpha *= s / 1.6; s = 1.6; }
    gl_PointSize = min(s, uMax * uPR);
    float tw = 0.82 + 0.18 * sin(uTime * (1.2 + aSeed * 2.5) + aSeed * 60.0);
    vAlpha = alpha * tw * uDim;
    vColor = aColor;
    vRot = aSeed * 6.2831;
  }
`;
const starFrag = /* glsl */`
  uniform float uOpacity;
  varying vec3 vColor; varying float vAlpha; varying float vRot;
  void main(){
    float d = length(gl_PointCoord - 0.5);
    if (d > 0.5) discard;
    float a = (exp(-d * d * 38.0) + exp(-d * d * 9.0) * 0.25) * vAlpha * uOpacity;
    gl_FragColor = vec4(vColor, a);
  }
`;
const dustFrag = /* glsl */`
  uniform float uOpacity;
  varying vec3 vColor; varying float vAlpha; varying float vRot;
  void main(){
    float d = length(gl_PointCoord - 0.5);
    if (d > 0.5) discard;
    float a = smoothstep(0.5, 0.0, d);
    gl_FragColor = vec4(vColor, a * a * uOpacity * min(vAlpha * 1.4, 1.0));
  }
`;
const nebFrag = /* glsl */`
  uniform sampler2D uTex; uniform float uOpacity;
  varying vec3 vColor; varying float vAlpha; varying float vRot;
  void main(){
    vec2 uv = gl_PointCoord - 0.5;
    float c = cos(vRot), s = sin(vRot);
    uv = mat2(c, -s, s, c) * uv + 0.5;
    float t = texture2D(uTex, uv).r * smoothstep(0.5, 0.1, length(gl_PointCoord - 0.5));
    gl_FragColor = vec4(vColor, t * uOpacity * vAlpha);
  }
`;
function diskMaterial(frag, size, opacity, blending, extra = {}, max = 30) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uSize: { value: size }, uOpacity: { value: opacity }, uMax: { value: max }, ...extra },
    vertexShader: diskVert, fragmentShader: frag,
    transparent: true, depthWrite: false, blending
  });
}
function diskGeometry(list, extraAttrs) {
  const n = list.length;
  const P = new Float32Array(n * 3), Cc = new Float32Array(n * 3), S = new Float32Array(n), Sd = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const o = list[i];
    P[i * 3] = Math.hypot(o.x, o.z); P[i * 3 + 1] = Math.atan2(o.z, o.x); P[i * 3 + 2] = o.y;
    Cc[i * 3] = o.c.r; Cc[i * 3 + 1] = o.c.g; Cc[i * 3 + 2] = o.c.b;
    S[i] = o.s; Sd[i] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('aParams', new THREE.BufferAttribute(P, 3));
  g.setAttribute('aColor', new THREE.BufferAttribute(Cc, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(S, 1));
  g.setAttribute('aSeed', new THREE.BufferAttribute(Sd, 1));
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  return g;
}

{

    if (s.t < 1) {
      s.t += dt / s.dur;
      const head = s.from.clone().addScaledVector(s.dir, s.t * 160);
      const tail = head.clone().addScaledVector(s.dir, -s.len * Math.min(1, s.t * 3));
      const p = s.line.geometry.attributes.position.array;
      p[0] = head.x; p[1] = head.y; p[2] = head.z; p[3] = tail.x; p[4] = tail.y; p[5] = tail.z;
      s.line.geometry.attributes.position.needsUpdate = true;
      const col = s.line.geometry.attributes.color.array;
      col[0] = col[1] = col[2] = 1.6 * Math.sin(Math.min(1, s.t) * Math.PI);
      s.line.geometry.attributes.color.needsUpdate = true;
      if (s.t >= 1) { s.line.visible = false; s.next = 4 + Math.random() * 8; }
    } else if (started) {
      s.next -= dt;
      if (s.next <= 0) spawnShooter(s);
    }
  }
}

/* ---------- Post-procesado ---------- */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(PR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.5, 0.12));
composer.addPass(new OutputPass());
const grain = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uAmount: { value: 0.035 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uAmount; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5; float d = dot(c, c);
      vec2 off = c * d * 0.014;
      vec3 col = vec3(texture2D(tDiffuse, vUv + off).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - off).b);
      col += (h(vUv * 1700.0 + fract(uTime * 7.0) * 91.0) - 0.5) * uAmount;
      gl_FragColor = vec4(col, 1.0);
    }`
});
composer.addPass(grain);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* ---------- Audio ambiental (sintetizado en vivo) ---------- */
let audio = null, muted = false;
function startAudio() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
    master.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 7);
    const len = ctx.sampleRate * 6, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const conv = ctx.createConvolver(); conv.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.85; conv.connect(wet); wet.connect(master);
    const dry = ctx.createGain(); dry.gain.value = 0.22; dry.connect(master);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 850; lp.Q.value = 0.4;
    lp.connect(conv); lp.connect(dry);
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.045;
    const lfoG = ctx.createGain(); lfoG.gain.value = 380; lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    const chords = [[146.83, 220.0, 277.18, 369.99], [123.47, 185.0, 220.0, 293.66], [98.0, 146.83, 185.0, 246.94], [110.0, 164.81, 246.94, 277.18]];
    const voices = chords[0].map((f) => {
      const g = ctx.createGain(); g.gain.value = 0.055; g.connect(lp);
      const o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = f;
      const o2 = ctx.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f; o2.detune.value = 7;
      const g2 = ctx.createGain(); g2.gain.value = 0.45; o2.connect(g2); g2.connect(g);
      o1.connect(g); o1.start(); o2.start();
      return { o1, o2 };
    });
    let ci = 0;
    setInterval(() => {
      ci = (ci + 1) % chords.length;
      const now = ctx.currentTime;
      voices.forEach((v, i) => { v.o1.frequency.setTargetAtTime(chords[ci][i], now, 1.6); v.o2.frequency.setTargetAtTime(chords[ci][i], now, 1.6); });
    }, 11000);
    const bells = [587.33, 659.25, 739.99, 880.0, 987.77, 1174.66, 1318.51];
    const tone = (f, at, vol, dur) => {
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
      const g = ctx.createGain(); g.gain.value = 0;
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(vol, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g); g.connect(conv); g.connect(dry);
      o.start(at); o.stop(at + dur + 0.1);
    };
    const ping = () => { tone(bells[(Math.random() * bells.length) | 0], ctx.currentTime, 0.03, 3.2); setTimeout(ping, 2200 + Math.random() * 4800); };
    setTimeout(ping, 3500);
    audio = {
      ctx, master,
      chime() { const t = ctx.currentTime; [587.33, 739.99, 880.0, 1174.66].forEach((f, i) => tone(f, t + i * 0.09, 0.05, 2.8)); },
      swell() { const t = ctx.currentTime; [293.66, 369.99, 440.0, 554.37, 739.99, 880.0, 1108.73].forEach((f, i) => tone(f, t + i * 0.12, 0.05, 5)); }
    };
  } catch (e) { /* sin audio */ }
}
$('mute').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!audio) return;
  muted = !muted;
  const now = audio.ctx.currentTime;
  audio.master.gain.cancelScheduledValues(now);
  audio.master.gain.setTargetAtTime(muted ? 0 : 0.22, now, 0.4);
  e.currentTarget.textContent = 'Sonido: ' + (muted ? 'no' : 'sí');
});

/* ---------- Narración ---------- */
const narrEl = $('narr');
let narrToken = 0;
function narrate(lines, done, onLine) {
  const token = ++narrToken;
  let i = 0;
  const step = () => {
    if (token !== narrToken) return;
    if (i >= lines.length) { narrEl.classList.remove('show'); setTimeout(() => token === narrToken && done && done(), 1600); return; }
    narrEl.classList.remove('show');
    setTimeout(() => {
      if (token !== narrToken) return;
      narrEl.className = '';
      narrEl.textContent = lines[i];
      void narrEl.offsetWidth;
      narrEl.classList.add('show');
      onLine && onLine(i);
      const hold = 2600 + lines[i].length * 55;
      i++;
      setTimeout(step, hold);
    }, narrEl.textContent ? 1700 : 0);
  };
  step();
}

/* ---------- HUD ---------- */
for (let i = 0; i < MS; i++) $('dots').appendChild(document.createElement('i'));
function updateHud() {
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < order.length));
  $('count').textContent = order.length === MS ? 'Constelación completa' : `${order.length} de ${MS} estrellas`;
}
updateHud();
let tipTimer = null;
function tip(text, ms = 6000) {
  $('tip').textContent = text;
  $('tip').classList.add('on');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => $('tip').classList.remove('on'), ms);
}

/* ---------- Estado ---------- */
let started = false, mode = 'intro';   // intro | fly | narr | explore | finale
let focus = -1, cardOpen = false, exploreTime = 0;
let baseDist = 50, returning = false;
let msFade = 0, msFadeTarget = 0;
let finaleT = -1;

/* ---------- Tarjeta ---------- */
const cardWrap = $('cardWrap'), card = $('card');
function openCard(i) {
  const isNew = !msFound[i];
  if (isNew) {
    msFound[i] = 1;
    msGeo.attributes.aFound.needsUpdate = true;
    order.push(i);
    updateHud();
    audio && audio.chime();
  }
  if (focus < 0) baseDist = camera.position.distanceTo(controls.target);
  focus = i; returning = false;
  const m = CONFIG.estrellas[i];
  card.querySelector('.num').textContent = `Estrella ${order.indexOf(i) + 1} de ${MS}`;
  card.querySelector('.ttl').textContent = m.titulo;
  const txt = card.querySelector('.txt');
  txt.innerHTML = m.texto.split(' ').map((w, k) => `<span style="transition-delay:${0.35 + k * 0.07}s">${esc(w)}</span>`).join(' ');
  cardWrap.classList.remove('open');
  void card.offsetWidth;
  cardWrap.classList.add('open');
  cardOpen = true;
  if (order.length >= Math.ceil(MS / 2) && order.length < MS) $('finBtn').style.display = 'inline-block';
}
function closeCard() {
  if (!cardOpen) return;
  cardOpen = false;
  cardWrap.classList.remove('open');
  focus = -1; returning = true;
  if (order.length === MS && mode === 'explore') setTimeout(startFinale, 1400);
  else if (order.length === 1) tip('Sigue buscando · arrastra para girar la galaxia', 6000);
}
cardWrap.addEventListener('click', closeCard);

/* ---------- Toques ---------- */
const sv = new THREE.Vector3();
function pickStar(cx, cy) {
  let best = -1, bd = TOUCH ? 46 : 32;
  for (let i = 0; i < MS; i++) {
    msWorld(i, sv).project(camera);
    if (sv.z > 1) continue;
    const x = (sv.x + 1) / 2 * innerWidth, y = (1 - sv.y) / 2 * innerHeight;
    const d = Math.hypot(x - cx, y - cy);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const tap = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 9 && performance.now() - downAt.t < 400;
  downAt = null;
  if (!tap) return;
  if (mode === 'explore' || mode === 'done') {
    const i = pickStar(e.clientX, e.clientY);
    if (i >= 0) openCard(i);
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (TOUCH || (mode !== 'explore' && mode !== 'done')) return;
  canvas.style.cursor = pickStar(e.clientX, e.clientY) >= 0 ? 'pointer' : '';
});

/* ---------- Entrada ---------- */
let flyT = 0;
const FLY = 9.0;
$('intro').addEventListener('click', () => {
  if (started) return;
  started = true; mode = 'fly';
  $('intro').classList.add('hide');
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  startAudio();
  setTimeout(() => {
    mode = 'narr';
    narrate(CONFIG.intro, () => {
      mode = 'explore';
      msFadeTarget = 1;
      $('hud').classList.add('on');
      $('ui').classList.add('on');
      tip(TOUCH ? 'Toca las estrellas que brillan distinto' : 'Haz clic en las estrellas que brillan distinto', 8000);
    }, (i) => { if (i === 2) msFadeTarget = 1; });
  }, (FLY - 2.5) * 1000);
});

/* ---------- Final ---------- */
$('finBtn').addEventListener('click', (e) => { e.stopPropagation(); if (mode === 'explore') { closeCard(); startFinale(); } });
function startFinale() {
  if (mode !== 'explore') return;
  mode = 'finale';
  $('finBtn').style.display = 'none';
  $('hud').classList.remove('on');
  focus = -1; returning = true; baseDist = Math.max(baseDist, 52);
  buildName();
  const lines = order.length === MS ? CONFIG.antesDelFinal_todas : CONFIG.antesDelFinal_algunas;
  narrate(lines, () => {
    nameGroup.visible = true;
    finaleT = 0;
    audio && audio.swell();
    setTimeout(() => {
      narrEl.className = 'final';
      narrEl.innerHTML = esc(CONFIG.finalTitulo) + '<span class="small">' + esc(CONFIG.finalSub) + '</span>';
      void narrEl.offsetWidth;
      narrEl.classList.add('show');
    }, 6200);
    setTimeout(() => { $('replay').style.display = 'inline-block'; $('replay').classList.add('hl'); }, 11000);
  });
}
$('replay').addEventListener('click', (e) => {
  e.stopPropagation();
  $('replay').style.display = 'none';
  narrToken++;
  narrEl.classList.remove('show');
  finaleT = -2;
  mode = 'done';
  $('hud').classList.add('on');
  if (order.length < MS) { mode = 'explore'; }
  tip('Puedes volver a tocar cualquier estrella', 6000);
});

/* ---------- Cámara ---------- */
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const sph = new THREE.Spherical();
const PORTRAIT = innerWidth < innerHeight;
function flyCamera(p) {
  const e = ease(p);
  sph.set(THREE.MathUtils.lerp(430, PORTRAIT ? 68 : 50, e), THREE.MathUtils.lerp(0.18, 1.12, e), THREE.MathUtils.lerp(-2.4, 0, e));
  camera.position.setFromSpherical(sph);
  camera.lookAt(0, 0, 0);
}
flyCamera(0);
baseDist = PORTRAIT ? 68 : 50;

/* ---------- Bucle ---------- */
const clock = new THREE.Clock();
let time = 0;
const ORIGIN = new THREE.Vector3();
const want = new THREE.Vector3(), off = new THREE.Vector3(), fwd = new THREE.Vector3(), upv = new THREE.Vector3();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;
  U.uTime.value = time;
  grain.uniforms.uTime.value = time;

  if (mode === 'intro') {
    sph.set(430, 0.18, -2.4 + Math.sin(time * 0.05) * 0.2);
    camera.position.setFromSpherical(sph);
    camera.lookAt(0, 0, 0);
  } else if (!controls.enabled) {
    flyT = Math.min(1, flyT + dt / FLY);
    flyCamera(flyT);
    if (flyT >= 1) { controls.target.set(0, 0, 0); controls.enabled = true; controls.autoRotate = true; controls.update(); }
  } else {
    // enfoque cinematográfico en la estrella tocada
    if (focus >= 0) msWorld(focus, want); else want.copy(ORIGIN);
    const k = 1 - Math.exp(-dt * 2.2);
    off.copy(camera.position).sub(controls.target);
    controls.target.lerp(want, k);
    let len = off.length();
    if (focus >= 0) len = THREE.MathUtils.lerp(len, 18, 1 - Math.exp(-dt * 1.5));
    else if (returning) {
      len = THREE.MathUtils.lerp(len, baseDist, 1 - Math.exp(-dt * 1.3));
      if (Math.abs(len - baseDist) < 0.4 && controls.target.length() < 0.3) returning = false;
    }
    camera.position.copy(controls.target).add(off.setLength(len));
    controls.autoRotate = focus < 0;
    controls.update();
  }

  if (mode === 'explore') exploreTime += dt;
  if (mode === 'explore' && exploreTime > 150 && order.length < MS && $('finBtn').style.display !== 'inline-block') $('finBtn').style.display = 'inline-block';

  msFade += (msFadeTarget - msFade) * (1 - Math.exp(-dt * 1.2));
  msMat.uniforms.uMsOpacity.value = msFade;
  if (order.length) updateLines();

  // final
  if (finaleT >= 0) {
    finaleT += dt;
    const m = Math.min(1, finaleT / 6);
    nameU.uMorph.value = m;
    nameU.uNameOp.value = Math.min(1, finaleT / 1.2);
    U.uDim.value = 1 - 0.5 * m;
    lineMat.opacity = 0.35 + 0.45 * m;
    if (finaleT > 5.2 && flashT < 0) flashT = 0;
  } else if (finaleT < -1) {
    nameU.uNameOp.value = Math.max(0, nameU.uNameOp.value - dt * 0.6);
    U.uDim.value = Math.min(1, U.uDim.value + dt * 0.3);
    lineMat.opacity = Math.max(0.35, lineMat.opacity - dt * 0.3);
    if (nameU.uNameOp.value <= 0 && U.uDim.value >= 1) { nameGroup.visible = false; nameU.uMorph.value = 0; finaleT = -1; flashT = -1; }
  }
  if (nameGroup.visible) {
    camera.getWorldDirection(fwd);
    const vFov = THREE.MathUtils.degToRad(camera.fov);
    const D = NAME_W / (0.82 * 2 * Math.tan(vFov / 2) * camera.aspect);
    upv.set(0, 1, 0).applyQuaternion(camera.quaternion);
    const visH = 2 * D * Math.tan(vFov / 2);
    nameGroup.position.copy(camera.position).addScaledVector(fwd, D).addScaledVector(upv, visH * 0.08);
    nameGroup.quaternion.copy(camera.quaternion);
    if (flashT >= 0 && flashT < 3) {
      flashT += dt;
      const p = flashT / 2.2;
      const s = NAME_W * (0.3 + p * 1.8);
      flashRing.scale.set(s, s, 1);
      flashRing.material.opacity = Math.max(0, 0.8 * (1 - p));
      flashGlow.scale.set(NAME_W * 1.4, NAME_W * 0.7, 1);
      flashGlow.material.opacity = Math.max(0, 0.55 * Math.sin(Math.min(1, flashT / 1.4) * Math.PI));
    }
  }

  updateShooters(dt);
  composer.render();
  requestAnimationFrame(loop);
}
loop();
window.__ready = true;
</script>
</body>
</html>
