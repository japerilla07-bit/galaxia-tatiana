<style>

    animation:spark 4.2s ease-in-out infinite}
  @keyframes spark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}40%{opacity:.95;transform:scale(1) rotate(30deg)}62%{opacity:0;transform:scale(.4) rotate(70deg)}}
  #narr{letter-spacing:.07em;transition:opacity 2.2s ease,transform 2.4s cubic-bezier(.2,.7,.2,1),filter 2.2s ease,letter-spacing 3.4s cubic-bezier(.2,.7,.2,1)}
  #narr.show{letter-spacing:.005em}
  #narr.lead{font-size:clamp(44px,8vw,88px)}

    transition:opacity 1.5s ease,filter 1.8s ease,transform 1.8s cubic-bezier(.2,.7,.2,1)}
  #narr.show .ft .l{opacity:1;filter:blur(0);transform:none}
  #narr .small{opacity:0;transition:opacity 2.4s ease 2.2s}
  #narr.show .small{opacity:.8}
  #card{overflow:hidden;transition:opacity .9s ease,transform 1s cubic-bezier(.2,.7,.2,1),filter 1s ease;
    background:radial-gradient(120% 80% at 12% 0%,rgba(255,213,154,.10),transparent 55%),radial-gradient(90% 70% at 100% 100%,rgba(160,120,255,.10),transparent 60%),linear-gradient(160deg,rgba(28,18,46,.55),rgba(8,6,18,.5))}

  #cardWrap.open #card::after{animation:sheen 2.8s cubic-bezier(.2,.7,.2,1) .25s forwards}

  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:20;font-size:22px;font-style:italic;background:#000}

<script type="module">
/* =====================================================================
   ✏️  TEXTOS — todo lo que se lee está aquí
   ===================================================================== */
const CONFIG = {
  nombre: 'Tatiana',
  portadaArriba: 'Noviembre es tu mes',
  portadaAbajo: 'una galaxia hecha estrella por estrella, para ti',

  intro: [
    'Tatiana…',
    'Este pequeño universo lo hice pensando en ti.',
    'Entre todas sus estrellas, doce brillan distinto.',
    'Cada una guarda algo que quiero que sepas. Encuéntralas.'
  ],

  estrellas: [
    { titulo: 'Fortaleza',    texto: 'Hay batallas que nadie ve. Y aun así, tú sigues de pie, con la frente en alto.' },
    { titulo: 'Valentía',     texto: 'Ser fuerte no es no caerse nunca. Es exactamente lo que tú haces: levantarte cada vez.' },
    { titulo: 'Luz propia',   texto: 'Las estrellas más brillantes nacen dentro de las nubes más oscuras del universo. Eso explica mucho de ti.' },
    { titulo: 'Inteligencia', texto: 'Tu forma de pensar tiene algo que no se encuentra fácil. Se nota que no te conformas con lo superficial.' },
    { titulo: 'Esfuerzo',     texto: 'Todo lo que tienes te lo has ganado tú. Y eso dice más de ti que cualquier palabra.' },
    { titulo: 'Belleza',      texto: 'Eres la pelona mas linda. Pero lo más bonito de ti es la fuerza con la que brillas.' },
    { titulo: 'Única',        texto: 'Hay personas que se olvidan rápido. Tú definitivamente no eres una de ellas.' },
    { titulo: 'Paciencia',    texto: 'Si algún día todo pesa demasiado, recuerda: hasta el universo necesitó tiempo para encontrar su forma.' },
    { titulo: 'Orgullo',      texto: 'Mira todo lo que has superado. Deberías estar muy orgullosa de la mujer que eres.' },
    { titulo: 'Lo que viene', texto: 'Lo mejor no quedó atrás. Lo mejor apenas está empezando a brillar.' },
    { titulo: 'Noviembre',    texto: 'Este mes es tuyo. Ojalá te lo celebren como te mereces, porque te mereces mucho.' },
    { titulo: 'Un deseo',     texto: 'Que este nuevo año de vida te devuelva, multiplicado, todo lo bueno que das.' }
  ],

  antesDelFinal_todas: ['Las encontraste todas.', 'Ahora mira lo que forman juntas…'],
  antesDelFinal_algunas: ['Todavía quedan estrellas por descubrir…', 'pero mira esto.'],
  finalTitulo: 'Feliz mes de cumpleaños',
  finalSub: 'Sigue brillando, Tatiana. El universo se ve mejor contigo en él.'
};
/* ===================================================================== */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Portada ---------- */
$('kicker').textContent = CONFIG.portadaArriba;
$('introSub').textContent = CONFIG.portadaAbajo;
[...CONFIG.nombre].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? ' ' : ch;
  s.style.animationDelay = (0.7 + i * 0.13) + 's';
  $('name').appendChild(s);
});
[[-4, 22], [103, 30], [14, 92], [88, 96], [52, -6], [-9, 72], [107, 78]].forEach(([x, y], k) => {
  const s = document.createElement('i');
  s.className = 'spark';
  s.style.left = x + '%'; s.style.top = y + '%';
  s.style.animationDelay = (2.4 + k * 0.75) + 's';
  document.querySelector('.nameWrap').appendChild(s);
});
(() => {
  const d = $('introDust');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 4) + 's';
    s.style.animationDuration = (3 + Math.random() * 4) + 's';
    const z = Math.random() < .12 ? 3 : (Math.random() < .5 ? 1 : 2);
    s.style.width = s.style.height = z + 'px';
    d.appendChild(s);
  }
})();

const LOW = Math.min(innerWidth, innerHeight) < 700 || (navigator.hardwareConcurrency || 8) <= 4;
const TOUCH = matchMedia('(pointer: coarse)').matches;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Renderer ---------- */
const canvas = $('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) { $('err').style.display = 'flex'; throw e; }
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); $('err').textContent = 'Recuperando la galaxia…'; $('err').style.display = 'flex'; });
canvas.addEventListener('webglcontextrestored', () => location.reload());
const PR = Math.min(devicePixelRatio || 1, LOW ? 1.5 : 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 5000);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 240;
controls.rotateSpeed = 0.5;
controls.zoomSpeed = 0.7;
controls.autoRotateSpeed = RM ? 0.08 : 0.28;
controls.enabled = false;

/* ---------- utilidades ---------- */
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const C = (h) => new THREE.Color(h);
function canvasTex(size, draw) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  draw(cv.getContext('2d'), size);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const cloudTexture = () => canvasTex(256, (g, size) => {
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 46; i++) {
    const ang = Math.random() * Math.PI * 2, dist = Math.pow(Math.random(), 1.4) * size * 0.26;
    const x = size / 2 + Math.cos(ang) * dist, y = size / 2 + Math.sin(ang) * dist;
    const r = size * (0.08 + Math.random() * 0.2);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(255,255,255,${0.05 + Math.random() * 0.08})`);
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  g.globalCompositeOperation = 'destination-in';
  const m = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(0.6, 'rgba(0,0,0,.8)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = m; g.fillRect(0, 0, size, size);
});
const glowTexture = (size = 256) => canvasTex(size, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.08, 'rgba(255,240,220,.75)');
  gr.addColorStop(0.25, 'rgba(255,200,160,.22)');
  gr.addColorStop(0.55, 'rgba(255,170,150,.05)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
const ringTexture = () => canvasTex(256, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, s * 0.32, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,255,255,0)');
  gr.addColorStop(0.55, 'rgba(255,230,200,.9)');
  gr.addColorStop(0.75, 'rgba(255,170,200,.25)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});

/* ---------- Uniforms compartidos ---------- */
const U = {
  uTime: { value: 0 },
  uPR: { value: PR },
  uSpeed: { value: 0.016 },
  uDim: { value: 1 }
};
const omega = (r) => U.uSpeed.value * (0.55 + 0.9 / (1.0 + r * 0.16));

const diskVert = /* glsl */`
  uniform float uTime, uPR, uSpeed, uSize, uDim, uMax;
  attribute vec3 aParams;
  attribute vec3 aColor;
  attribute float aSize;
  attribute float aSeed;
  varying vec3 vColor;
  varying float vAlpha;
  varying float vRot;

        lp.frequency.setTargetAtTime(on ? 2200 : 850, t, 3);
        subG.gain.setTargetAtTime(on ? 0.075 : 0.05, t, 3);
        if (!muted) master.gain.setTargetAtTime(on ? 0.28 : 0.22, t, 3);
      }
    };
  } catch (e) { /* sin audio */ }
}
$('mute').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!audio) return;
  muted = !muted;
  const now = audio.ctx.currentTime;
  audio.master.gain.cancelScheduledValues(now);
  audio.master.gain.setTargetAtTime(muted ? 0 : 0.22, now, 0.4);
  e.currentTarget.textContent = 'Sonido: ' + (muted ? 'no' : 'sí');
});

/* ---------- Narración ---------- */
const narrEl = $('narr');
let narrToken = 0;
function narrate(lines, done, onLine) {
  const token = ++narrToken;
  let i = 0;
  const step = () => {
    if (token !== narrToken) return;
    if (i >= lines.length) { narrEl.classList.remove('show'); setTimeout(() => token === narrToken && done && done(), 1600); return; }
    narrEl.classList.remove('show');
    setTimeout(() => {
      if (token !== narrToken) return;
      narrEl.className = (lines === CONFIG.intro && i === 0) ? 'lead' : '';
      narrEl.textContent = lines[i];
      void narrEl.offsetWidth;
      narrEl.classList.add('show');
      onLine && onLine(i);
      const hold = 2600 + lines[i].length * 55;
      i++;
      setTimeout(step, hold);
    }, narrEl.textContent ? 1700 : 0);
  };
  step();
}

/* ---------- HUD ---------- */
for (let i = 0; i < MS; i++) $('dots').appendChild(document.createElement('i'));
function updateHud() {
  [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i < order.length));
  $('count').textContent = order.length === MS ? 'Constelación completa' : `${order.length} de ${MS} estrellas`;
}
updateHud();
let tipTimer = null;
function tip(text, ms = 6000) {
  $('tip').textContent = text;
  $('tip').classList.add('on');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => $('tip').classList.remove('on'), ms);
}

/* ---------- Estado ---------- */
let started = false, mode = 'intro';   // intro | fly | narr | explore | finale
let focus = -1, cardOpen = false, exploreTime = 0;
let baseDist = 50, returning = false;
let msFade = 0, msFadeTarget = 0;
let finaleT = -1;
let finaleCam = false, textShown = false, btnShown = false;
let lastFocus = -1, focusAmt = 0, expBump = 0, bloomBump = 0;

/* ---------- Tarjeta ---------- */
const cardWrap = $('cardWrap'), card = $('card');
function openCard(i) {
  const isNew = !msFound[i];
  if (isNew) {
    msFound[i] = 1;
    msFoundT[i] = U.uTime.value;
    msGeo.attributes.aFound.needsUpdate = true;
    msGeo.attributes.aFoundT.needsUpdate = true;
    order.push(i);
    updateHud();
    expBump = Math.max(expBump, 0.14);
    if (audio) { audio.chime(); audio.progress(order.length / MS); }
  }
  if (focus < 0) baseDist = camera.position.distanceTo(controls.target);
  focus = i; lastFocus = i; returning = false;
  const m = CONFIG.estrellas[i];
  card.querySelector('.num').textContent = `Estrella ${order.indexOf(i) + 1} de ${MS}`;
  card.querySelector('.ttl').innerHTML = '<svg viewBox="0 0 24 24"><path fill="#ffd59a" d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z"/></svg>' + esc(m.titulo);
  const txt = card.querySelector('.txt');
  txt.innerHTML = m.texto.split(' ').map((w, k) => `<span style="transition-delay:${0.35 + k * 0.07}s">${esc(w)}</span>`).join(' ');
  cardWrap.classList.remove('open');
  void card.offsetWidth;
  cardWrap.classList.add('open');
  cardOpen = true;
  openedAt = performance.now();
  if (order.length >= Math.ceil(MS / 2) && order.length < MS) $('finBtn').style.display = 'inline-block';
}
function closeCard() {
  if (!cardOpen) return;
  cardOpen = false;
  cardWrap.classList.remove('open');
  focus = -1; returning = true;
  if (order.length === MS && mode === 'explore') setTimeout(startFinale, 1400);
  else if (order.length === 1) tip('Sigue buscando · arrastra para girar la galaxia', 6000);
}
let openedAt = 0;
// el mismo toque que abre la tarjeta genera un click fantasma en móvil: se ignora
cardWrap.addEventListener('click', () => { if (performance.now() - openedAt > 450) closeCard(); });

/* ---------- Toques ---------- */
const sv = new THREE.Vector3();
function pickStar(cx, cy) {
  let best = -1, bd = TOUCH ? 46 : 32;
  for (let i = 0; i < MS; i++) {
    msWorld(i, sv).project(camera);
    if (sv.z > 1) continue;
    const x = (sv.x + 1) / 2 * innerWidth, y = (1 - sv.y) / 2 * innerHeight;
    const d = Math.hypot(x - cx, y - cy);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
let downAt = null;
canvas.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt) return;
  const tap = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 9 && performance.now() - downAt.t < 400;
  downAt = null;
  if (!tap) return;
  if (mode === 'explore' || mode === 'done') {
    const i = pickStar(e.clientX, e.clientY);
    if (i >= 0) openCard(i);
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (TOUCH || (mode !== 'explore' && mode !== 'done')) return;
  canvas.style.cursor = pickStar(e.clientX, e.clientY) >= 0 ? 'pointer' : '';
});

/* ---------- Entrada ---------- */
let flyT = 0;
const FLY = RM ? 5.0 : 9.0;
$('intro').addEventListener('click', () => {
  if (started) return;
  started = true; mode = 'fly';
  $('intro').classList.add('hide');
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
  startAudio();
  setTimeout(() => {
    mode = 'narr';
    narrate(CONFIG.intro, () => {
      mode = 'explore';
      msFadeTarget = 1;
      $('hud').classList.add('on');
      $('ui').classList.add('on');
      tip(TOUCH ? 'Toca las estrellas que brillan distinto' : 'Haz clic en las estrellas que brillan distinto', 8000);
    }, (i) => { if (i === 2) msFadeTarget = 1; });
  }, (FLY - 2.5) * 1000);
});

/* ---------- Final ---------- */
$('finBtn').addEventListener('click', (e) => { e.stopPropagation(); if (mode === 'explore') { closeCard(); startFinale(); } });
function startFinale() {
  if (mode !== 'explore') return;
  mode = 'finale';
  $('finBtn').style.display = 'none';
  $('hud').classList.remove('on');
  focus = -1; returning = false; finaleCam = true;
  textShown = btnShown = false;
  audio && audio.finale(true);
  buildName();
  const lines = order.length === MS ? CONFIG.antesDelFinal_todas : CONFIG.antesDelFinal_algunas;
  narrate(lines, () => {
    nameGroup.visible = true;
    finaleT = 0;
    audio && audio.swell();
  });
}
function showFinalText() {
  const title = CONFIG.finalTitulo.split(' ').map((w) => '<span class="w">' + [...w].map((ch) => `<span class="l">${esc(ch)}</span>`).join('') + '</span>').join(' ');
  narrEl.className = 'final';
  narrEl.innerHTML = '<span class="ft">' + title + '</span><span class="small">' + esc(CONFIG.finalSub) + '</span>';
  narrEl.querySelectorAll('.ft .l').forEach((el, k) => { el.style.transitionDelay = (k * 0.055).toFixed(3) + 's'; });
  void narrEl.offsetWidth;
  narrEl.classList.add('show');
}
$('replay').addEventListener('click', (e) => {
  e.stopPropagation();
  $('replay').style.display = 'none';
  narrToken++;
  narrEl.classList.remove('show');
  finaleT = -2;
  finaleCam = false; returning = true;
  audio && audio.finale(false);
  mode = order.length < MS ? 'explore' : 'done';
  $('hud').classList.add('on');
  tip('Puedes volver a tocar cualquier estrella', 6000);
});

/* ---------- Cámara ---------- */
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const sph = new THREE.Spherical();
const PORTRAIT = innerWidth < innerHeight;
function flyCamera(p) {
  const e = ease(p);
  sph.set(THREE.MathUtils.lerp(430, PORTRAIT ? 68 : 50, e), THREE.MathUtils.lerp(0.18, 1.12, e), THREE.MathUtils.lerp(-2.4, 0, e));
  camera.position.setFromSpherical(sph);
  camera.lookAt(0, 0, 0);
  camera.fov = THREE.MathUtils.lerp(68, 55, e);
  camera.updateProjectionMatrix();
}
flyCamera(0);
baseDist = PORTRAIT ? 68 : 50;

/* ---------- Bucle ---------- */
const clock = new THREE.Clock();
let time = 0, rafId = 0, paused = false;
let fpsAcc = 0, fpsFrames = 0, quality = 0;
const ORIGIN = new THREE.Vector3();
const want = new THREE.Vector3(), off = new THREE.Vector3(), fwd = new THREE.Vector3(), upv = new THREE.Vector3(), rgt = new THREE.Vector3();
const fsph = new THREE.Spherical();
function degrade() {
  quality++;
  const pr = Math.max(1, PR * (quality === 1 ? 0.75 : 0.55));
  U.uPR.value = pr;
  renderer.setPixelRatio(pr);
  composer.setPixelRatio(pr);
  composer.setSize(innerWidth, innerHeight);
  volMat.uniforms.uSteps.value = Math.max(12, volMat.uniforms.uSteps.value - 8);
  volScale *= 0.75;
  resizeVol();
}
function loop() {
  const raw = clock.getDelta();
  const dt = Math.min(raw, 0.05);
  time += dt;
  U.uTime.value = time;
  grain.uniforms.uTime.value = time;

  // calidad adaptativa: si el equipo no da, se baja la resolución y los pasos del volumen
  if (started) {
    fpsAcc += raw; fpsFrames++;
    if (fpsAcc > 2.5) { if (fpsFrames / fpsAcc < 36 && quality < 2) degrade(); fpsAcc = 0; fpsFrames = 0; }
  }

  if (mode === 'intro') {
    sph.set(430, 0.18, -2.4 + Math.sin(time * 0.05) * 0.2);
    camera.position.setFromSpherical(sph);
    camera.lookAt(0, 0, 0);
  } else if (!controls.enabled) {
    flyT = Math.min(1, flyT + dt / FLY);
    flyCamera(flyT);
    if (flyT >= 1) { controls.target.set(0, 0, 0); controls.enabled = true; controls.autoRotate = true; controls.update(); }
  } else {
    if (focus >= 0) msWorld(focus, want); else want.copy(ORIGIN);
    const k = 1 - Math.exp(-dt * 2.2);
    off.copy(camera.position).sub(controls.target);
    controls.target.lerp(want, k);
    let len = off.length();
    if (focus >= 0) len = THREE.MathUtils.lerp(len, 18, 1 - Math.exp(-dt * 1.5));
    else if (finaleCam) {
      // plano privilegiado para la revelación
      fsph.setFromVector3(off);
      const kf = 1 - Math.exp(-dt * 0.6);
      fsph.radius = THREE.MathUtils.lerp(fsph.radius, PORTRAIT ? 70 : 58, kf);
      fsph.phi = THREE.MathUtils.lerp(fsph.phi, 1.02, kf);
      off.setFromSpherical(fsph);
      len = off.length();
    } else if (returning) {
      len = THREE.MathUtils.lerp(len, baseDist, 1 - Math.exp(-dt * 1.3));
      if (Math.abs(len - baseDist) < 0.4 && controls.target.length() < 0.3) returning = false;
    }
    camera.position.copy(controls.target).add(off.setLength(len));
    controls.autoRotate = focus < 0;
    controls.autoRotateSpeed = RM ? 0.08 : (finaleCam ? 0.12 : 0.28);
    controls.update();
  }

  if (mode === 'explore') exploreTime += dt;
  if (mode === 'explore' && exploreTime > 150 && order.length < MS && $('finBtn').style.display !== 'inline-block') $('finBtn').style.display = 'inline-block';

  msFade += (msFadeTarget - msFade) * (1 - Math.exp(-dt * 1.2));
  msMat.uniforms.uMsOpacity.value = msFade;
  focusAmt += ((focus >= 0 ? 1 : 0) - focusAmt) * (1 - Math.exp(-dt * 1.8));
  msMat.uniforms.uFocus.value = lastFocus;
  msMat.uniforms.uFocusAmt.value = focusAmt;
  if (order.length) updateLines();

  // secuencia final
  let dimTarget = 1, energyTarget = 0, lineTarget = 0.35;
  if (mode === 'finale') {
    lineTarget = 0.85;
    if (finaleT < 0) { dimTarget = 0.55; energyTarget = 1; }
    else {
      finaleT += dt;
      const m = Math.min(1, finaleT / 7);
      nameU.uMorph.value = m;
      nameU.uNameOp.value = Math.min(1, finaleT / 1.0);
      const after = finaleT > 6.6;
      if (finaleT > 4.5) lineTarget = 0.18;   // el nombre manda: la constelación se retira
      dimTarget = after ? 0.82 : 0.5;
      energyTarget = after ? 0.45 : 1;
      if (finaleT > 6.4 && flashT < 0) { flashT = 0; expBump = 0.55; bloomBump = 0.8; }
      if (finaleT > 7.4 && !textShown) { textShown = true; showFinalText(); }
      if (finaleT > 12.5 && !btnShown) { btnShown = true; $('replay').style.display = 'inline-block'; $('replay').classList.add('hl'); }
    }
  } else if (finaleT < -1) {
    nameU.uNameOp.value = Math.max(0, nameU.uNameOp.value - dt * 0.6);
    if (nameU.uNameOp.value <= 0) { nameGroup.visible = false; nameU.uMorph.value = 0; finaleT = -1; flashT = -1; }
  }
  U.uDim.value += (dimTarget - U.uDim.value) * (1 - Math.exp(-dt * 0.8));
  msMat.uniforms.uEnergy.value += (energyTarget - msMat.uniforms.uEnergy.value) * (1 - Math.exp(-dt * 1.2));
  lineMat.opacity += (lineTarget - lineMat.opacity) * (1 - Math.exp(-dt * 0.8));

  if (nameGroup.visible) {
    camera.getWorldDirection(fwd);
    const vFov = THREE.MathUtils.degToRad(camera.fov);
    const D = NAME_W / (0.82 * 2 * Math.tan(vFov / 2) * camera.aspect);
    upv.set(0, 1, 0).applyQuaternion(camera.quaternion);
    rgt.set(1, 0, 0).applyQuaternion(camera.quaternion);
    const visH = 2 * D * Math.tan(vFov / 2);
    nameGroup.position.copy(camera.position).addScaledVector(fwd, D).addScaledVector(upv, visH * 0.08);
    nameGroup.quaternion.copy(camera.quaternion);
    nameUp.value.copy(upv); nameSide.value.copy(rgt);
    nameSize.value = 42 * D / 16 * Math.min(1, Math.max(0.55, innerWidth / 1280));
    if (flashT >= 0 && flashT < 3) {
      flashT += dt;
      const p = flashT / 2.2;
      const s = NAME_W * (0.3 + p * 1.8);
      flashRing.scale.set(s, s, 1);
      flashRing.material.opacity = Math.max(0, 0.8 * (1 - p));
      flashGlow.scale.set(NAME_W * 1.4, NAME_W * 0.7, 1);
      flashGlow.material.opacity = Math.max(0, 0.55 * Math.sin(Math.min(1, flashT / 1.4) * Math.PI));
    }
  }

  // exposición y bloom respiran con los momentos importantes
  expBump *= Math.exp(-dt * 1.4);
  bloomBump *= Math.exp(-dt * 1.2);
  renderer.toneMappingExposure = 0.95 * (1 + expBump);
  bloom.strength = 0.75 + bloomBump;

  motesMat.uniforms.uCamPos.value.copy(camera.position);
  updateShooters(dt);
  renderVolume();
  composer.render();
  rafId = requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    paused = true;
    cancelAnimationFrame(rafId);
    audio && audio.ctx.suspend();
  } else if (paused) {
    paused = false;
    clock.getDelta();
    audio && audio.ctx.resume();
    rafId = requestAnimationFrame(loop);
  }
});
loop();
window.__ready = true;
</script>
</body>
</html>
